<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpendWise</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
 
  <style>
    :root {
      --primary: #B8A5E8;
      --primary-dark: #9B8FD4;
      --bg: #FFF8F5;
      --card: #FFFFFF;
      --text: #2D2D3A;
      --text-secondary: #8E8E93;
      --success: #5AC18E;
      --warning: #FFB347;
      --danger: #FF6B6B;
    }
 
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
 
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 40px;
      min-height: 100vh;
    }
 
    /* ---------- Header ---------- */
 
    .header {
      text-align: center;
      margin: 20px 0 28px;
    }
 
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
 
    .header p {
      color: var(--text-secondary);
      font-size: 15px;
    }
 
    /* ---------- Balance card ---------- */
 
    .balance-card {
      background: linear-gradient(135deg, #C4B5E0 0%, #A89BD6 100%);
      border-radius: 28px;
      padding: 28px;
      color: white;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(168, 155, 214, 0.3);
    }
 
    .balance-label {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 8px;
      font-weight: 500;
    }
 
    .balance-amount {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -1px;
    }
 
    .stats-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
 
    .stat {
      flex: 1;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 14px;
      text-align: center;
    }
 
    .stat-value {
      font-size: 18px;
      font-weight: 700;
    }
 
    .stat-label {
      font-size: 12px;
      opacity: 0.9;
      margin-top: 4px;
      font-weight: 500;
    }
 
    /* ---------- Section title ---------- */
 
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin: 28px 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
 
    /* ---------- Envelope cards ---------- */
 
    .envelope-card {
      background: var(--card);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      gap: 16px;
      transition: transform 0.2s;
    }
 
    .envelope-card:active {
      transform: scale(0.98);
    }
 
    .envelope-icon {
      font-size: 36px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F6FF;
      border-radius: 16px;
    }
 
    .envelope-info {
      flex: 1;
    }
 
    .envelope-name {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 4px;
    }
 
    .envelope-meta {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
 
    .progress-track {
      height: 8px;
      background: #F2F2F7;
      border-radius: 4px;
      overflow: hidden;
    }
 
    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    }
 
    /* ---------- Buttons ---------- */
 
    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      background: linear-gradient(135deg, #C4B5E0 0%, #A89BD6 100%);
      color: white;
      box-shadow: 0 4px 16px rgba(168, 155, 214, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
 
    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(168, 155, 214, 0.2);
    }
 
    .btn-outline {
      background: white;
      color: var(--primary-dark);
      border: 2px solid #E8E0F5;
      box-shadow: none;
    }
 
    /* ---------- Badges ---------- */
 
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: auto;
    }
 
    .badge-success { background: #E8F5E9; color: var(--success); }
    .badge-warning { background: #FFF3E0; color: #F9A825; }
    .badge-danger  { background: #FFEBEE; color: var(--danger); }
 
    /* ---------- Empty / error state ---------- */
 
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
 
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
 
    /* ---------- Animation ---------- */
 
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
 
    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }
  </style>
</head>
 
<body>
 
  <div class="header fade-in">
    <h1 id="greeting">Привет! 👋</h1>
    <p>Твой умный бюджет</p>
</div>

<pre id="debug" style="background:#000; color:#0f0; padding:10px; border-radius:8px; font-size:11px; overflow-x:auto; margin-bottom:16px; white-space:pre-wrap;"></pre>
 
  <div class="balance-card fade-in" style="animation-delay: 0.1s">
    <div class="balance-label">💰 Осталось в этом месяце</div>
    <div class="balance-amount" id="balance">0 ₽</div>
 
    <div class="stats-row">
      <div class="stat">
        <div class="stat-value" id="income">0 ₽</div>
        <div class="stat-label">📥 Бюджет</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="spent">0 ₽</div>
        <div class="stat-label">📤 Потрачено</div>
      </div>
    </div>
  </div>
 
  <div class="section-title fade-in" style="animation-delay: 0.2s">📂 Мои конверты</div>
 
  <div id="envelopes" class="fade-in" style="animation-delay: 0.3s">
    <div class="empty-state">
      <div class="empty-state-icon">📭</div>
      <div>Загрузка данных...</div>
    </div>
  </div>
 
  <button class="btn btn-outline fade-in" style="animation-delay: 0.35s" onclick="loadDashboard()">
    🔄 Обновить
  </button>
 
  <button class="btn fade-in" style="animation-delay: 0.4s" onclick="tg.close()">
    ✕ Закрыть приложение
  </button>
 
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    document.getElementById('debug').textContent = JSON.stringify({
    platform: tg.platform,
    version: tg.version,
    initData: tg.initData,
    initDataUnsafe: tg.initDataUnsafe
}, null, 2);
 
    // ═══════════════════════════════════════
    // URL твоего бэкенда на Railway
    // ═══════════════════════════════════════
    const API_BASE = "https://spendwise-bot-production.up.railway.app";
 
    const fmt = (n) => n.toLocaleString('ru-RU') + ' ₽';
 
    // userId заполняется как только Telegram передаст данные пользователя.
    // На некоторых клиентах (например, Desktop) это происходит не мгновенно,
    // поэтому если с первого раза userId нет — пробуем ещё раз чуть позже.
    let userId = tg.initDataUnsafe?.user?.id;
 
    function updateGreeting() {
      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById('greeting').textContent =
          `Привет, ${user.first_name || 'друг'}! 👋`;
      }
    }
 
    function showUserNotFound() {
      document.getElementById('envelopes').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">❌</div>
          <div>Не удалось определить пользователя Telegram</div>
          <div style="margin-top:8px; font-size:13px;">
            Попробуй закрыть и снова открыть приложение
          </div>
        </div>
      `;
    }
 
    async function loadDashboard() {
      if (!userId) {
        showUserNotFound();
        return;
      }
 
      try {
        const res = await fetch(
          `${API_BASE}/api/user/${userId}/dashboard?t=${Date.now()}`,
          { cache: 'no-store' }
        );
 
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
 
        document.getElementById('balance').textContent = fmt(data.remaining);
        document.getElementById('income').textContent = fmt(data.total_budget);
        document.getElementById('spent').textContent = fmt(data.total_spent);
 
        const container = document.getElementById('envelopes');
        container.innerHTML = '';
 
        if (!data.envelopes || data.envelopes.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📭</div>
              <div>У тебя пока нет конвертов</div>
              <div style="margin-top:8px; font-size:13px;">
                Создай через бота: 🆕 Новый конверт
              </div>
            </div>
          `;
          return;
        }
 
        data.envelopes.forEach((e, i) => {
          let color = 'linear-gradient(90deg, #B8A5E8, #9B8FD4)';
          let badge = '<span class="badge badge-success">OK</span>';
 
          if (e.percent > 90) {
            color = 'linear-gradient(90deg, #FF6B6B, #FF8E8E)';
            badge = '<span class="badge badge-danger">⚠️</span>';
          } else if (e.percent > 70) {
            color = 'linear-gradient(90deg, #FFB347, #FFCC80)';
            badge = '<span class="badge badge-warning">!</span>';
          }
 
          container.innerHTML += `
            <div class="envelope-card fade-in" style="animation-delay: ${0.3 + i * 0.1}s">
              <div class="envelope-icon">${e.icon}</div>
              <div class="envelope-info">
                <div style="display:flex; align-items:center; gap:8px;">
                  <div class="envelope-name">${e.name}</div>
                  ${badge}
                </div>
                <div class="envelope-meta">
                  ${fmt(e.spent)} из ${fmt(e.budget)} · осталось ${fmt(e.remaining)}
                </div>
                <div class="progress-track">
                  <div class="progress-fill" style="width: ${e.percent}%; background: ${color}"></div>
                </div>
              </div>
            </div>
          `;
        });
 
      } catch (err) {
        console.error(err);
        document.getElementById('envelopes').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🔌</div>
            <div>Не удалось загрузить данные</div>
            <div style="margin-top:8px; font-size:13px;">Проверь URL API в коде</div>
          </div>
        `;
      }
    }
 
    // ---------- Запуск ----------
 
    if (userId) {
      updateGreeting();
      loadDashboard();
    } else {
      // Даём Telegram немного времени передать данные пользователя
      setTimeout(() => {
        userId = tg.initDataUnsafe?.user?.id;
        updateGreeting();
        loadDashboard();
      }, 300);
    }
 
    // Перезагружаем данные каждый раз, когда приложение снова становится видимым
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        loadDashboard();
      }
    });
  </script>
</body>
</html>
