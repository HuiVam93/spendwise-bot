<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpendWise</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #B8A5E8;
            --primary-dark: #9B8FD4;
            --bg: #FFF8F5;
            --card: #FFFFFF;
            --text: #2D2D3A;
            --text-secondary: #8E8E93;
            --success: #5AC18E;
            --warning: #FFB347;
            --danger: #FF6B6B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 40px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin: 20px 0 28px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .balance-card {
            background: linear-gradient(135deg, #C4B5E0 0%, #A89BD6 100%);
            border-radius: 28px;
            padding: 28px;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(168, 155, 214, 0.3);
        }

        .balance-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .balance-amount {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .stats-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .stat {
            flex: 1;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 14px;
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
            font-weight: 500;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin: 28px 0 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .envelope-card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: transform 0.2s;
        }

        .envelope-card:active { transform: scale(0.98); }

        .envelope-icon {
            font-size: 36px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F8F6FF;
            border-radius: 16px;
        }

        .envelope-info { flex: 1; }

        .envelope-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .envelope-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .progress-track {
            height: 8px;
            background: #F2F2F7;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            background: linear-gradient(135deg, #C4B5E0 0%, #A89BD6 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(168, 155, 214, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(168, 155, 214, 0.2);
        }

        .btn-outline {
            background: white;
            color: var(--primary-dark);
            border: 2px solid #E8E0F5;
            box-shadow: none;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: auto;
        }

        .badge-success { background: #E8F5E9; color: var(--success); }
        .badge-warning { background: #FFF3E0; color: #F9A825; }
        .badge-danger { background: #FFEBEE; color: var(--danger); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon { font-size: 48px; margin-bottom: 12px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body>

    <div class="header fade-in">
        <h1 id="greeting">Привет! 👋</h1>
        <p>Твой умный бюджет</p>
    </div>

    <div class="balance-card fade-in" style="animation-delay: 0.1s">
        <div class="balance-label">💰 Осталось в этом месяце</div>
        <div class="balance-amount" id="balance">0 ₽</div>
        <div class="stats-row">
            <div class="stat">
                <div class="stat-value" id="income">0 ₽</div>
                <div class="stat-label">📥 Бюджет</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="spent">0 ₽</div>
                <div class="stat-label">📤 Потрачено</div>
            </div>
        </div>
    </div>

    <div class="section-title fade-in" style="animation-delay: 0.2s">📂 Мои конверты</div>
    <div id="envelopes" class="fade-in" style="animation-delay: 0.3s">
        <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <div>Загрузка данных...</div>
        </div>
    </div>

    <button class="btn fade-in" style="animation-delay: 0.4s" onclick="tg.close()">✕ Закрыть приложение</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Подстраиваемся под тему Telegram
        if (tg.themeParams.bg_color) {
            document.body.style.background = tg.themeParams.bg_color;
        }

        // Приветствие по имени из Telegram
        const user = tg.initDataUnsafe?.user;
        if (user) {
            const name = user.first_name || 'друг';
            document.getElementById('greeting').textContent = `Привет, ${name}! 👋`;
        }

        // Форматирование денег
        const fmt = (n) => n.toLocaleString('ru-RU') + ' ₽';

        // ========== ДЕМО-ДАННЫЕ (заменим на реальные в следующей сессии) ==========
        const demoEnvelopes = [
            { icon: '🛒', name: 'Продукты', spent: 4200, budget: 8000 },
            { icon: '🚌', name: 'Транспорт', spent: 1800, budget: 3000 },
            { icon: '☕', name: 'Кафе', spent: 3600, budget: 4000 },
        ];

        document.getElementById('balance').textContent = fmt(15400);
        document.getElementById('income').textContent = fmt(25000);
        document.getElementById('spent').textContent = fmt(9600);

        const container = document.getElementById('envelopes');
        container.innerHTML = '';

        demoEnvelopes.forEach((e, i) => {
            const pct = Math.min((e.spent / e.budget) * 100, 100);
            let color = 'linear-gradient(90deg, #B8A5E8, #9B8FD4)';
            let badge = '<span class="badge badge-success">OK</span>';
            
            if (pct > 90) {
                color = 'linear-gradient(90deg, #FF6B6B, #FF8E8E)';
                badge = '<span class="badge badge-danger">⚠️</span>';
            } else if (pct > 70) {
                color = 'linear-gradient(90deg, #FFB347, #FFCC80)';
                badge = '<span class="badge badge-warning">!</span>';
            }

            const remaining = e.budget - e.spent;

            container.innerHTML += `
                <div class="envelope-card" style="animation-delay: ${0.3 + i * 0.1}s">
                    <div class="envelope-icon">${e.icon}</div>
                    <div class="envelope-info">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <div class="envelope-name">${e.name}</div>
                            ${badge}
                        </div>
                        <div class="envelope-meta">
                            ${fmt(e.spent)} из ${fmt(e.budget)} · осталось ${fmt(remaining)}
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${pct}%; background: ${color}"></div>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
